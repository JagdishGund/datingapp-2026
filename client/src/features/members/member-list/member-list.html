@if (paginatedMembers(); as paginatedResult) {
  <div class="flex flex-col w-full">
    <div class="flex justify-between items-center">
      <div class="flex gap-3 items-center">
        <button (click)="openModal()" class="btn btn-primary">Select filter</button>
        <button (click)="resetFilters()" class="btn btn-neutral">Reset filter</button>
        <div class="text-lg bg-base-100 py-2 px-4 border rounded-1 text-primary capitalize">
          {{displayMessage}}
        </div>
      </div>
       @if (paginatedResult.metaData; as metaData) {
    <app-paginator [(pageNumber)]="metaData.currentPage" [totalCount]="metaData.totalCount" [(pageSize)]="metaData.pageSize"
      [totalPages]="metaData.totalPages" (pageChange)="onPageChange($event)" />
    }
    </div>
      @if(paginatedResult.items; as members){
      <div class="grid grid-cols-5 gap-4">
        @for(member of members ; track member.id){
        <app-member-card [member]="member"></app-member-card>
        }
      </div>
      }
  </div>
 }
<app-filter-modal
 #filterModal
 [hidden]="!paginatedMembers()"
 (closeModal)="onClose()"
 (submitData)="onFilterChange($event)"
 />
