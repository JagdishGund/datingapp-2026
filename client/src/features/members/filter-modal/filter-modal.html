<dialog #filterModal class="modal">
  <div class="modal-box max-w-lg">
    <h3 class="font-bold text-lg">Select filters</h3>
    <div class="flex justify-center w-full items-center mt-6">
        <div class="flex flex-col gap-6 w-full">
                <label class="flex justify-between items-center">
                    <span class="font-semibold">Select Gender:</span>
                    <form class="filter">
                        <input type="reset" value="x" class="btn btn-square">
                        <input
                         type="radio" class="btn"
                         [(ngModel)]="memberParams().gender"
                         aria-label="Male"
                         name="gender" value="Male">

                        <input
                         type="radio" class="btn"
                         [(ngModel)]="memberParams().gender"
                         aria-label="Female"
                         name="gender" value="Female">
                    </form>                    
                </label>
                <label class="flex justify-between items-center">
                    <span class="font-semibold">Select Age:</span>
                    <div class="flex gap-3">
                        <input
                        type="number"
                        class="input w-20"
                        [min]="18"
                        [(ngModel)]="memberParams().minAge"
                        name="minAge"            
                        (change)="OnMinAgeChange()"
                        >
                         <input
                        type="number"
                        class="input w-20"
                        [min]="memberParams().minAge || 18"
                        [(ngModel)]="memberParams().maxAge"
                        name="maxAge"
                        (change)="onMaxAgeChange()"
                        >
                    </div>
                </label>
                <label class="flex justify-between items-center"></label>
                <span class="font-semibold">Order By:</span>
                <select name="oderBy"  class="select" [(ngModel)]="memberParams().orderBy">
                    <option disabled selected>Order by</option>
                    <option value="created">Newest members</option>
                    <option value="lastActive">Last active</option>                    
                </select>
    </div>
    </div>
    <div class="modal-action">
      <form method="dialog">
        <!-- if there is a button in form, it will close the modal -->
        <button (click)="submit()" class="btn btn-primary">Submit</button>
      </form>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
    </form>
</dialog>
